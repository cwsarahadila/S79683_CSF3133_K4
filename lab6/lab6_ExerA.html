<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
 <title>Rock, Paper, Scissors Game</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
<script src="game.js"></script> 
<header>
<h1>Rock, Paper, Scissors Game</h1>
<p>Enter your name ! click start game,then choose  between Rock, Paper or Scissors</p>
</header>

<section class="card">
        <label for="playerName">Your name:</label>
        <input type="text" id="playerName" placeholder="Enter your name">
        <button onclick="startGame()">Start Game</button>
        <p id="welcomeMsg"></p>
    </section>

   <section class="card">
        <div class="choices">
            <button onclick="playRound('rock')">Rock</button>
            <button onclick="playRound('paper')">Paper</button>
            <button onclick="playRound('scissors')">Scissors</button>
        </div>

<div class="battle-area">
            <div>
                <p><strong>You</strong></p>
                <img id="playerImg" src="rock.png" alt="Player Choice">
            </div>
            <span class="vs">VS</span>
            <div>
                <p><strong>Computer</strong></p>
                <img id="computerImg" src="rock.png" alt="Computer Choice">
            </div>
        </div>
    </section>

<!-- Result & Scoreboard Section -->
    <section class="card">
        <p id="result"></p>
        <p class="scoreboard">
            Wins: <span id="wins">0</span> |
            Losses: <span id="losses">0</span> |
            Draws: <span id="draws">0</span>
        </p>
    </section>

    <!-- History & Controls Section -->
    <section class="card">
        <h2>History</h2>
        <table id="history">
            <tr>
                <th>Round  </th>
                <th>You  </th>
                <th>Computer </th>
                <th>Result</th>
            </tr>
        </table>



<div class="controls">
            <button onclick="showSummary()">Show Summary</button>
            <button onclick="resetGame()">Reset</button>
        </div>
        <p id="summary"></p>
    </section>


<--!footer-->
<footer>
<p id="start time"> </p>
<p>&copy;2026 Computer Science Club </p>
</footer>

</body>
</html>
